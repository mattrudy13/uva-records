<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UVA Records</title>
<meta name="description" content="Every UVA head-to-head sport's record, season by season and game by game, since 2000-01.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Graduate&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar" id="topbar"></header>

<main class="wrap">
  <div class="page-head">
    <div>
      <h1 id="title">UVA Records</h1>
      <p class="sub" id="subtitle">Every head-to-head sport, one academic year at a time.</p>
    </div>
    <div class="controls">
      <label for="year" class="muted">Season</label>
      <select id="year"></select>
    </div>
  </div>

  <div id="content"><p class="skeleton">Loading&hellip;</p></div>
</main>

<footer id="footer"></footer>

<script src="common.js"></script>
<script>
renderChrome("index.html");
renderFooter();

async function init() {
  const content = document.getElementById("content");
  try {
    const [meta, seasons, opponents] = await Promise.all([loadMeta(), loadJSON("seasons.json"), loadJSON("opponents.json")]);
    const yearSel = document.getElementById("year");
    for (let y = meta.current; y >= 2000; y--) yearSel.add(new Option(academicLabel(y), y));
    const asked = Number(params().get("year"));
    yearSel.value = asked >= 2000 && asked <= meta.current ? asked : meta.current;
    yearSel.addEventListener("change", () => {
      history.replaceState(null, "", yearSel.value == meta.current ? "index.html" : `?year=${yearSel.value}`);
      render(meta, seasons, opponents, Number(yearSel.value));
    });
    render(meta, seasons, opponents, Number(yearSel.value));
  } catch (err) {
    showError(content, err);
  }
}

function render(meta, seasons, opponents, year) {
  const live = year === meta.current;
  document.getElementById("title").innerHTML = `${year}<span class="dash">&ndash;</span>${String(year + 1).slice(2)}`;
  let total = { w: 0, l: 0, t: 0 }, inProgress = 0, marks = false;
  const card = sport => {
    const rows = seasons[sport.slug] || [];
    const row = rows.find(r => r.start === year);
    const prev = rows.find(r => r.start === year - 1);
    // No row: either no team that year, or (this year) the schedule isn't posted yet.
    if (!row && !(live && prev)) return "";
    const href = `sport.html?s=${sport.slug}${row ? `&season=${encodeURIComponent(row.season)}` : ""}`;
    const started = row && (row.listed > 0 || games(row.record) > 0);
    if (!started) {
      // Not started yet: first game date, and last season's record in outline.
      return `<a class="sport-card waiting" href="${href}">
        <span class="state">${row && row.first ? `Starts ${fmtDate(row.first, false)}` : "Schedule not posted yet"}</span>
        <span class="name">${esc(sport.name)}</span>
        <span class="rec num">${prev ? fmtRec(prev.record) : "&mdash;"}</span>
        <span class="meta">${prev ? `Last season (${esc(prev.season)})` : "First season"}</span>
        ${sparkline(rows, year - 1)}<span class="cuff"></span></a>`;
    }
    total = addRec(total, row.record);
    const going = live && row.upcoming > 0;
    if (going) inProgress++;
    if (row.status === "incomplete") marks = true;
    // The next game goes under the record, so the status line stays one line and
    // records line up across a row.
    const state = going ? '<span class="state live">In progress</span>' : '<span class="state">Final</span>';
    const post = postText(row.post);
    return `<a class="sport-card" href="${href}">
      ${state}
      <span class="name">${esc(sport.name)}</span>
      <span class="rec num">${fmtRec(row.record)}${seasonMark(row)}</span>
      <span class="meta">${games(row.conf) ? `${fmtRec(row.conf)} ACC` : ""}${row.coach ? `${games(row.conf) ? " &middot; " : ""}${esc(row.coach)}` : ""}</span>
      ${post ? `<span class="meta">${esc(post)}</span>` : ""}
      ${going && row.next ? `<span class="meta next">Next game ${fmtDate(row.next, false)}</span>` : ""}
      ${sparkline(rows, year)}<span class="cuff"></span></a>`;
  };
  // Grouped by when each sport plays, in the order sports.json lists them.
  const groups = ["fall", "winter", "spring"].map(term => {
    const cards = meta.sports.filter(s => s.term === term).map(card).filter(Boolean);
    // Columns that the tiles fill evenly, so no tile sits alone on a row: five
    // across for five, three for six.
    const cols = cards.length <= 5 ? cards.length : cards.length % 3 === 0 ? 3 : 4;
    return cards.length ? `<h2 class="term">${term[0].toUpperCase() + term.slice(1)}</h2><div class="grid" style="--cols:${cols}">${cards.join("")}</div>` : "";
  }).join("");

  const vt = opponents.find(o => o.slug === meta.rival_slug);
  const vtYear = (vt && vt.by_year && vt.by_year[year]) || {};
  let vtTotal = { w: 0, l: 0, t: 0 };
  const vtRows = Object.entries(vtYear).map(([slug, r]) => {
    vtTotal = addRec(vtTotal, r);
    return `<span>${esc(meta.bySlug[slug].name)} <b class="num">${fmtRec(r)}</b></span>`;
  }).join("");
  const nSports = Object.keys(vtYear).length;

  document.getElementById("content").innerHTML = `
    <div class="scorebox num">
      <div><b>${fmtRec(total)}</b><span>All sports${inProgress ? " so far" : ""}</span></div>
      <div><b>${fmtPct(pctOf(total)) || "&mdash;"}</b><span>Win %</span></div>
      ${inProgress ? `<div><b>${inProgress}</b><span>In progress</span></div>` : ""}
    </div>
    ${groups}
    ${marks ? `<div class="footnotes"><p>&dagger; UVA's site is missing games for this season. The record shown is official; the game list is partial.</p></div>` : ""}
    <section class="rival">
      <div class="score"><b class="num">${vtRows ? fmtRec(vtTotal) : "&mdash;"}</b><span>vs. Virginia Tech</span></div>
      <div class="info">
        <h2>Virginia Tech, ${academicLabel(year)}</h2>
        ${vtRows ? `<div class="list">${vtRows}</div>` : `<p>No games against Virginia Tech yet in ${academicLabel(year)}.</p>`}
        <p>${vtRows ? `${nSports} sport${nSports > 1 ? "s" : ""} &middot; ` : ""}All-time since 2000: <b class="num">${fmtRec(vt.record)}</b>
          &middot; <a href="opponents.html?o=${meta.rival_slug}">Full series</a></p>
      </div>
    </section>`;
}

init();
</script>
</body>
</html>
